    - data:
        code: "def main(dag_json_str: str) -> dict:\n    cleaned = dag_json_str.strip()\n\
          \    if \"<think>\" in cleaned:\n        import re\n        cleaned = re.sub(r\"\
          <think>.*?</think>\", \"\", cleaned, flags=re.S).strip()\n    if \"</think>\"\
          \ in cleaned:\n        cleaned = cleaned.split(\"</think>\", 1)[1].strip()\n\
          \    if cleaned.startswith(\"```json\"): cleaned = cleaned[7:]\n    if cleaned.startswith(\"\
          ```\"): cleaned = cleaned[3:]\n    if cleaned.endswith(\"```\"): cleaned\
          \ = cleaned[:-3]\n    cleaned = cleaned.strip()\n    errors = []\n    try:\n\
          \        dag = json.loads(cleaned)\n    except Exception as e:\n       \
          \ return {\"is_valid\": False, \"errors\": [\"JSON解析失败: %s\" % e], \"dag_json\"\
          : cleaned}\n    valid_ops = {\"Load\", \"RegexFilter\", \"ColumnFilter\"\
          , \"GroupBy\", \"Merge\", \"Sort\",\n                 \"ConditionCheck\"\
          , \"Extract\", \"Transform\", \"NoiseFilter\", \"Aggregate\",\n        \
          \         \"Diff\", \"Export\", \"Reconcile\", \"AuditAdjustment\"}\n  \
          \  ids = []\n    for i, op in enumerate(dag.get(\"operators\", [])):\n \
          \       if \"id\" not in op: errors.append(\"operators[%d]: 缺少id\" % i)\n\
          \        else: ids.append(op[\"id\"])\n        if \"name\" not in op: errors.append(\"\
          operators[%d]: 缺少name\" % i)\n        elif op[\"name\"] not in valid_ops:\
          \ errors.append(\"operators[%d]: 未知算子 %s\" % (i, op[\"name\"]))\n    dup\
          \ = sorted({x for x in ids if ids.count(x) > 1})\n    if dup: errors.append(\"\
          重复算子ID: %s\" % dup)\n    id_set = set(ids)\n    for i, op in enumerate(dag.get(\"\
          operators\", [])):\n        refs = op.get(\"input_from\") or []\n      \
          \  if isinstance(refs, str): refs = [refs]\n        for ref in refs:\n \
          \           if ref not in id_set: errors.append(\"operators[%d]: input_from\
          \ 引用不存在的算子 %s\" % (i, ref))\n    score = dag.get(\"confidence_score\", 0)\n\
          \    if not (0 <= score <= 1): errors.append(\"confidence_score 越界: %s\"\
          \ % score)\n    if not dag.get(\"human_review_points\"): errors.append(\"\
          human_review_points 不能为空\")\n    return {\"is_valid\": len(errors) == 0,\
          \ \"errors\": errors, \"dag_json\": json.dumps(dag, ensure_ascii=False)}\n"
        code_language: python3
