            \n### 置信度评分\n- 0.9-1.0：金额列清晰，对手列无空值\n- 0.7-0.9：对手列部分空值\n- < 0.5：交易结构无法识别，建议自由编译\n\
            \n---\n\n## 章节5（preset_button = \"智能筛选\"）\n\n## 预设模式：智能筛选\n\n你是数据筛选专家。本次编译必须严格遵循以下固定算子模板。\n\
