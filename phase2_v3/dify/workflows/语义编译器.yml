            Step 3: Diff — 与底稿同源勾稽\nStep 4: Export — 生成文档（Word/Excel，优先事务所模板）\n\n\
            ### 固化审计准则（不可偏离）\n1. 报告数字与底稿审定数同源勾稽，不一致禁止出具\n2. 函证默认积极式；未回函给替代程序清单\n3.\
