app:
  description: 基于法规库检索的审计专业问答
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: workflow
  name: 知识问答
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openai_api_compatible:0.0.55@d64be9924f2edf13fd5329fc03fdfc0d0e0e36e0aef5321c4942f0845de8c030
    version: null
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        sourceType: start
        targetType: llm
      id: e1
      source: start
      sourceHandle: source
      target: llm
      targetHandle: target
      type: custom
    - data:
        sourceType: llm
        targetType: code
      id: e2
      source: llm
      sourceHandle: source
      target: code_validator
      targetHandle: target
      type: custom
    - data:
        sourceType: code
        targetType: end
      id: e3
      source: code_validator
      sourceHandle: source
      target: end_node
      targetHandle: target
      type: custom
    nodes:
    - data:
        desc: ''
        selected: false
        title: 开始
        type: start
        variables:
        - label: user_intent
          required: true
          type: paragraph
          variable: user_intent
        - label: compliance_context
          required: false
          type: paragraph
          variable: compliance_context
      height: 134
      id: start
      position:
        x: 80
        y: 200
      positionAbsolute:
        x: 80
        y: 200
      selected: false
      type: custom
      width: 242
    - data:
        context:
          enabled: false
        desc: ''
        model:
          completion_params:
            enable_thinking: false
            max_tokens: 4096
            temperature: 0.3
            top_p: 1
          mode: chat
          name: qwen3-235b
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - id: 7b358ad5-09d0-4dd4-8540-eea9d783d2a7
          role: system
          text: '你是「审计知识问答引擎」。基于compliance_context回答审计师的专业问题。


            ## 核心规则

            1. 回答必须基于compliance_context中的法规条文，不得臆造

            2. 无相关信息时诚实说明"当前法规库未检索到相关内容"并给出查询建议

            3. 回答结构：结论→法规依据(标注来源)→实务建议(分步骤)

            4. 绝不提供避税等不合规建议


            ## 输出格式(严格JSON)

            {"answer":"详细回答","sources":["来源文件"],"practical_guidance":"分步建议","related_topics":[],"confidence":0.85}

            - confidence基于context覆盖程度，不足时<0.5

            - 只输出JSON

            '
        - id: b0dcaafd-46ac-45da-b495-003586170abc
          role: user
          text: '## 法规上下文

            {{#start.compliance_context#}}


            ## 审计师问题

            {{#start.user_intent#}} /no_think'
        selected: true
        title: 知识问答引擎
        type: llm
        vision:
          enabled: false
      height: 87
      id: llm
      position:
        x: 380
        y: 180
      positionAbsolute:
        x: 380
        y: 180
      selected: true
      type: custom
      width: 242
    - data:
        code: "def main(llm_output: str) -> dict:\n    c=llm_output.strip()\n    if\
          \ c.startswith(\"```json\"): c=c[7:]\n    if c.startswith(\"```\"): c=c[3:]\n\
          \    if c.endswith(\"```\"): c=c[:-3]\n    try: return {\"result\":json.dumps(json.loads(c.strip()),ensure_ascii=False),\"\
          is_valid\":True,\"errors\":[]}\n    except Exception as e: return {\"result\"\
          :c,\"is_valid\":False,\"errors\":[str(e)]}\n"
        code_language: python3
        desc: ''
        language: python
        outputs:
          errors:
            type: array[string]
          is_valid:
            type: boolean
          result:
            type: string
        retry_config:
          max_retries: 3
          retry_enabled: true
          retry_interval: 1000
        selected: false
        title: 输出校验
        type: code
        variables:
        - value_selector:
          - llm
          - text
          value_type: string
          variable: llm_output
      height: 81
      id: code_validator
      position:
        x: 680
        y: 180
      positionAbsolute:
        x: 680
        y: 180
      selected: false
      type: custom
      width: 242
    - data:
        desc: ''
        outputs:
        - value_selector:
          - code_validator
          - result
          value_type: string
          variable: result
        - value_selector:
          - code_validator
          - is_valid
          value_type: boolean
          variable: status
        selected: false
        title: 结束
        type: end
      height: 114
      id: end_node
      position:
        x: 980
        y: 200
      positionAbsolute:
        x: 980
        y: 200
      selected: false
      type: custom
      width: 242
    viewport:
      x: 0
      y: 0
      zoom: 1
  rag_pipeline_variables: []
