app:
  description: 基于审定数据生成审计报告
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: workflow
  name: 报告生成
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openai_api_compatible:0.0.55@d64be9924f2edf13fd5329fc03fdfc0d0e0e36e0aef5321c4942f0845de8c030
    version: null
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        sourceType: start
        targetType: llm
      id: e1
      source: start
      sourceHandle: source
      target: llm
      targetHandle: target
      type: custom
    - data:
        sourceType: llm
        targetType: code
      id: e2
      source: llm
      sourceHandle: source
      target: code_validator
      targetHandle: target
      type: custom
    - data:
        sourceType: code
        targetType: end
      id: e3
      source: code_validator
      sourceHandle: source
      target: end_node
      targetHandle: target
      type: custom
    nodes:
    - data:
        desc: ''
        selected: false
        title: 开始
        type: start
        variables:
        - label: catalog_text
          required: true
          type: paragraph
          variable: catalog_text
        - label: user_intent
          required: true
          type: paragraph
          variable: user_intent
        - label: audit_data
          required: false
          type: paragraph
          variable: audit_data
      height: 160
      id: start
      position:
        x: 80
        y: 200
      positionAbsolute:
        x: 80
        y: 200
      selected: false
      type: custom
      width: 242
    - data:
        context:
          enabled: false
        desc: ''
        model:
          completion_params:
            enable_thinking: true
            max_tokens: 4096
            temperature: 0.3
            top_p: 1
          mode: chat
          name: qwen3-235b
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - id: 12930855-eb1f-4f4e-b7c4-9e190112e641
          role: system
          text: "你是「审计报告生成器」。根据审定数据生成结构化报告DAG。\n\n## 核心规则\n1. 同源勾稽：报告中所有数值必须来源于底稿审定数据，不可凭空捏造\n\
            2. 数据流程：Load底稿→ColumnFilter→GroupBy按章节→Aggregate审定数→Export\n3. 输出JSON必须包含report_sections和expected_outputs数组\n\
            4. 可用算子：Load,ColumnFilter,GroupBy,Merge,Sort,Aggregate,Export\n5. 只输出JSON\n\
            6. 函证规范：默认积极式（重大/异常项目必须积极式，消极式仅限低风险小额）；\n   未回函项目须给替代程序（期后回款/对账单/银行存款余额调节表/原始凭证）。\n\
            7. 模板优先：工作底稿套用本所 C_底稿模板（D 系列）、询证函套用本所询证函范本\n   （由平台模板引擎执行，DAG 中 Export\
            \ 的 filename 注明拟套用模板名）。"
        - id: 17c47f09-3287-4720-8364-f23bc87ba45e
          role: user
          text: '## 数据目录

            {{#start.catalog_text#}}


            ## 审计意图

            {{#start.user_intent#}}


            ## 审定数据

            {{#start.audit_data#}}'
        selected: false
        title: 报告生成编译器
        type: llm
        vision:
          enabled: false
      height: 87
      id: llm
      position:
        x: 380
        y: 180
      positionAbsolute:
        x: 380
        y: 180
      selected: false
      type: custom
      width: 242
    - data:
        code: "def main(llm_output: str) -> dict:\n    c=llm_output.strip()\n    if\
          \ c.startswith(\"```json\"): c=c[7:]\n    if c.startswith(\"```\"): c=c[3:]\n\
          \    if c.endswith(\"```\"): c=c[:-3]\n    try: return {\"result\":json.dumps(json.loads(c.strip()),ensure_ascii=False),\"\
          is_valid\":True,\"errors\":[]}\n    except Exception as e: return {\"result\"\
          :c,\"is_valid\":False,\"errors\":[str(e)]}\n"
        code_language: python3
        desc: ''
        language: python
        outputs:
          errors:
            type: array[string]
          is_valid:
            type: boolean
          result:
            type: string
        retry_config:
          max_retries: 3
          retry_enabled: true
          retry_interval: 1000
        selected: false
        title: 输出校验
        type: code
        variables:
        - value_selector:
          - llm
          - text
          value_type: string
          variable: llm_output
      height: 81
      id: code_validator
      position:
        x: 680
        y: 180
      positionAbsolute:
        x: 680
        y: 180
      selected: false
      type: custom
      width: 242
    - data:
        desc: ''
        outputs:
        - value_selector:
          - code_validator
          - result
          value_type: string
          variable: result
        - value_selector:
          - code_validator
          - is_valid
          value_type: boolean
          variable: status
        selected: false
        title: 结束
        type: end
      height: 114
      id: end_node
      position:
        x: 980
        y: 200
      positionAbsolute:
        x: 980
        y: 200
      selected: false
      type: custom
      width: 242
    viewport:
      x: 0
      y: 0
      zoom: 1
  rag_pipeline_variables: []
