        sourceType: start
        targetType: llm
      id: e1
      source: start
      sourceHandle: source
      target: llm
      targetHandle: target
      type: custom
    - data:
        sourceType: llm
        targetType: code
      id: e2
      source: llm
      sourceHandle: source
      target: code_validator
      targetHandle: target
      type: custom
