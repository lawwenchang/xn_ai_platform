        sourceType: code
        targetType: end
      id: e3
      source: code_validator
      sourceHandle: source
      target: end_node
      targetHandle: target
      type: custom
    nodes:
    - data:
        desc: ''
        selected: false
        title: 开始
        type: start
        variables:
        - label: dag_json
          required: true
          type: paragraph
          variable: dag_json
        - label: error_log
          required: false
          type: paragraph
          variable: error_log
        - label: user_intent
          required: true
          type: paragraph
          variable: user_intent
      height: 160
      id: start
      position:
        x: 80
        y: 200
      positionAbsolute:
        x: 80
        y: 200
      selected: false
      type: custom
      width: 242
    - data:
        context:
          enabled: false
        desc: ''
        model:
          completion_params:
            enable_thinking: true
            max_tokens: 4096
            temperature: 0.3
            top_p: 1
          mode: chat
          name: qwen3-235b
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - id: 86fc8ca0-1fbf-4982-89e7-1b2c5d7c4490
          role: system
          text: "你是「审计DAG精修器」。对已生成的有向无环图（DAG）进行精修和错误修正。\n\n## 核心规则\n1. 若 error_log\
            \ 有内容，逐条分析报错并修正：\n   - 列名不存在 → 替换为 Data Catalog 中实际存在的列名（禁止编造、禁止照抄示例）\n\
            \   - 参数缺失 → 补充必要字段（Load 必须有 source_file 且逐字来自 Catalog）\n   - 依赖断裂 → input_from/depends_on\
            \ 必须引用存在的算子 ID（二者等价，保留原有写法）\n2. 若 error_log 为空，检查逻辑合理性：\n   - Load 的 source_file\
            \ 必须引用 Catalog 实际文件；幻觉文件名 → difflib 就近替换并注明\n   - Merge 连接键必须有业务含义，严禁「序号/编号/行号」；两表键名不同用\
            \ left_on/right_on\n   - GroupBy/Aggregate 的 aggregations 非空\n   - 算子顺序合理（Load→筛选→合并→聚合→排序→导出）\n\
            \   - 银行对账场景必须有 Reconcile 算子（tolerance_abs=0.01, date_window_days=3）；\n\
            \     序时账/台账×流水逐笔对账不得退化为 GroupBy 汇总比对\n3. 容差纪律：逐笔核对 tolerance_abs=0.01\
            \ 元；tolerance_pct 仅汇总层面且须意图明确指定\n4. 数据纪律：利息/手续费/冲正不删除，单独成类；缺失值只标记不填充\n\
            5. 可用算子：Load, RegexFilter, ColumnFilter, GroupBy, Merge, Sort, ConditionCheck,\n\
            \   Extract, Transform, NoiseFilter, Aggregate, Diff, Reconcile, AuditAdjustment,\
            \ Export\n6. 直接输出修正后的完整 DAG JSON，不输出其他文字\n"
        - id: 0e97be32-63b4-44e6-8107-7bc3faa63801
          role: user
          text: '## 待精修DAG

            {{#start.dag_json#}}


            ## 错误日志

            {{#start.error_log#}}


            ## 原始审计意图

            {{#start.user_intent#}}

            '
        selected: false
        title: DAG精修器
        type: llm
        vision:
          enabled: false
      height: 87
      id: llm
      position:
        x: 380
        y: 180
      positionAbsolute:
        x: 380
        y: 180
      selected: false
      type: custom
      width: 242
    - data:
        code: "def main(llm_output: str) -> dict:\n    c = llm_output.strip()\n  \
          \  if \"<think>\" in c:\n        import re\n        c = re.sub(r\"<think>.*?</think>\"\
          , \"\", c, flags=re.S).strip()\n    if \"</think>\" in c:\n        c = c.split(\"\
          </think>\", 1)[1].strip()\n    if c.startswith(\"```json\"): c = c[7:]\n\
          \    if c.startswith(\"```\"): c = c[3:]\n    if c.endswith(\"```\"): c\
          \ = c[:-3]\n    try:\n        return {\"result\": json.dumps(json.loads(c.strip()),\
          \ ensure_ascii=False), \"is_valid\": True, \"errors\": []}\n    except Exception\
          \ as e:\n        return {\"result\": c, \"is_valid\": False, \"errors\"\
          : [str(e)]}\n"
        code_language: python3
        desc: ''
        language: python
        outputs:
          errors:
            type: array[string]
          is_valid:
            type: boolean
          result:
            type: string
        retry_config:
          max_retries: 3
          retry_enabled: true
          retry_interval: 1000
        selected: false
        title: 输出校验
        type: code
        variables:
        - value_selector:
          - llm
          - text
          value_type: string
          variable: llm_output
      height: 81
      id: code_validator
      position:
        x: 680
        y: 180
      positionAbsolute:
        x: 680
        y: 180
      selected: false
      type: custom
      width: 242
    - data:
        desc: ''
        outputs:
        - value_selector:
          - code_validator
          - result
          value_type: string
          variable: result
        - value_selector:
          - code_validator
          - is_valid
          value_type: boolean
          variable: status
        selected: false
        title: 结束
        type: end
      height: 114
      id: end_node
      position:
        x: 980
        y: 200
      positionAbsolute:
        x: 980
        y: 200
      selected: false
      type: custom
      width: 242
    viewport:
      x: 0
      y: 150
      zoom: 1
  rag_pipeline_variables: []
